<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Control de Unidades R-O14</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e3a8a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --primary: #1e3a8a;
      --bg: #f1f5f9;
      --card: #ffffff;
      --border: #cbd5e1;
      --text: #0f172a;
      --muted: #64748b;
      --ok: #16a34a;
      --obs: #ea580c;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding-bottom: 80px; }
    
    /* Encabezado R-O14 */
    .header { background: var(--primary); color: white; padding: 14px 16px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
    .header-top { display: flex; justify-content: space-between; align-items: center; font-size: 12px; opacity: 0.9; margin-bottom: 4px; }
    .header h1 { margin: 0; font-size: 16px; letter-spacing: 0.3px; }
    
    /* Datos de Unidad */
    .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: var(--card); padding: 12px 16px; border-bottom: 1px solid var(--border); }
    .meta-field { display: flex; flex-direction: column; }
    .meta-field label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; }
    .meta-field input { border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 14px; margin-top: 2px; }
    
    /* Dashboard KPI */
    .kpi-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 12px 16px; }
    .kpi-card { background: var(--card); border-radius: 8px; padding: 10px; text-align: center; border: 1px solid var(--border); }
    .kpi-val { font-size: 20px; font-weight: 800; color: var(--primary); }
    .kpi-lbl { font-size: 11px; color: var(--muted); font-weight: 600; }

    /* Pestañas de Hojas Excel */
    .tabs { display: flex; overflow-x: auto; gap: 6px; padding: 0 16px 10px; border-bottom: 1px solid var(--border); }
    .tab-btn { background: #e2e8f0; border: none; padding: 8px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; cursor: pointer; }
    .tab-btn.active { background: var(--primary); color: white; }

    /* Secciones y Renglones */
    .section { margin: 12px 16px; background: var(--card); border-radius: 8px; border: 1px solid var(--border); overflow: hidden; }
    .section-title { background: #e2e8f0; padding: 10px 12px; font-weight: 800; font-size: 13px; color: var(--primary); display: flex; justify-content: space-between; align-items: center; }
    .sub-badges { display: flex; gap: 4px; flex-wrap: wrap; }
    .badge { background: white; border: 1px solid var(--border); padding: 2px 6px; border-radius: 4px; font-size: 10px; color: var(--text); }
    
    .task-row { border-top: 1px solid var(--border); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
    .task-row.done { background: #f0fdf4; }
    .task-main { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .task-text { font-size: 13px; line-height: 1.35; flex: 1; }
    .task-who { font-size: 10px; font-weight: 700; color: var(--muted); background: #f1f5f9; padding: 2px 6px; border-radius: 4px; }
    
    .controls { display: flex; gap: 8px; align-items: center; }
    .chk-btn { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); background: white; font-size: 12px; font-weight: 700; cursor: pointer; }
    .chk-btn.ok.active { background: var(--ok); color: white; border-color: var(--ok); }
    .chk-btn.obs.active { background: var(--obs); color: white; border-color: var(--obs); }
    
    /* Espacio para carga de texto por renglón (como en el Excel) */
    .note-input { width: 100%; border: 1px dashed var(--border); border-radius: 6px; padding: 6px 8px; font-size: 12px; background: #fafafa; resize: vertical; min-height: 34px; }
    .note-input:focus { outline: none; border-color: var(--primary); background: white; }

    /* Barra flotante inferior */
    .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); padding: 10px 16px; display: flex; gap: 10px; justify-content: space-between; z-index: 100; }
    .action-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; }
    .btn-export { background: var(--ok); color: white; }
    .btn-clear { background: #fee2e2; color: #b91c1c; }

    /* Tabla Matriz Control General */
    .matrix-wrap { overflow-x: auto; }
    table.matrix { width: 100%; border-collapse: collapse; font-size: 12px; }
    table.matrix th, table.matrix td { border: 1px solid var(--border); padding: 6px; text-align: center; }
    table.matrix td:first-child { text-align: left; min-width: 220px; position: sticky; left: 0; background: white; z-index: 2; }
    table.matrix th:first-child { position: sticky; left: 0; background: #e2e8f0; z-index: 3; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-top">
      <span>CÓDIGO: R-O14 | VERSIÓN: 03</span>
      <span>FECHA DOC: 22/06/2022</span>
    </div>
    <h1>CONTROL Y PUESTA A PUNTO DE UNIDADES</h1>
  </div>

  <div class="meta-grid">
    <div class="meta-field">
      <label>Unidad</label>
      <input type="text" id="meta-unidad" placeholder="Ej: 2B" oninput="saveMeta()">
    </div>
    <div class="meta-field">
      <label>Controlado Por</label>
      <input type="text" id="meta-inspector" placeholder="Nombre y Apellido" oninput="saveMeta()">
    </div>
    <div class="meta-field" style="grid-column: span 2;">
      <label>Fecha de Control</label>
      <input type="date" id="meta-fecha" oninput="saveMeta()">
    </div>
  </div>

  <div class="kpi-bar">
    <div class="kpi-card">
      <div class="kpi-val" id="kpi-pct">0%</div>
      <div class="kpi-lbl">AVANCE</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-val" id="kpi-ok" style="color: var(--ok);">0</div>
      <div class="kpi-lbl">APROBADOS</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-val" id="kpi-obs" style="color: var(--obs);">0</div>
      <div class="kpi-lbl">CON OBS.</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('hoja1', this)">1. Planilla Estándar</button>
    <button class="tab-btn" onclick="switchTab('hoja2', this)">2. Planilla Detallada (Sur/Norte)</button>
    <button class="tab-btn" onclick="switchTab('hoja3', this)">3. Control General (1A-4C)</button>
  </div>

  <div id="app-content"></div>

  <div class="bottom-bar">
    <button class="action-btn btn-clear" onclick="resetUnit()">Limpiar Unidad</button>
    <button class="action-btn btn-export" onclick="exportCSV()">Descargar Excel (CSV)</button>
  </div>
